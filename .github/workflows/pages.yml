name: pages

# The default GITHUB_TOKEN cannot create a Pages site. A repo admin turns it on once:
# Settings → Pages → Build and deployment → Source → GitHub Actions.
# After that, this workflow publishes docs/index.html and its assets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/index.html docs/styles.css docs/app.js docs/.nojekyll _site/
      - name: Upload H5 demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
